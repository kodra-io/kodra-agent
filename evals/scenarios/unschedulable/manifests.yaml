apiVersion: v1
kind: Namespace
metadata:
  name: unschedulable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-runner
  namespace: unschedulable
  labels: { app: batch-runner }
spec:
  replicas: 1
  selector:
    matchLabels: { app: batch-runner }
  template:
    metadata:
      labels: { app: batch-runner }
    spec:
      containers:
        - name: runner
          image: busybox:1.37
          command: ['sh', '-c', 'sleep 3600']
          resources:
            requests: { cpu: '64', memory: 64Mi }
