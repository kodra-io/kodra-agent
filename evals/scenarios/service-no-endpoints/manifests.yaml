apiVersion: v1
kind: Namespace
metadata:
  name: service-no-endpoints
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: service-no-endpoints
  labels: { app: checkout-v2 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout-v2 }
  template:
    metadata:
      labels: { app: checkout-v2 }
    spec:
      containers:
        - name: checkout
          image: busybox:1.37
          command: ['sh', '-c', "echo 'checkout listening on 8080'; sleep 3600"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: service-no-endpoints
spec:
  selector: { app: checkout }
  ports:
    - port: 80
      targetPort: 8080
