apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: release-500s
  labels: { app: orders }
  annotations: { kubernetes.io/change-cause: release 2.4.0 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: orders
          image: busybox:1.37
          env:
            - { name: RELEASE, value: '2.4.0' }
          command:
            [
              'sh',
              '-c',
              'while true; do echo "$(date -u +%H:%M:%S) GET /api/orders 500 3ms release=$RELEASE error=NullPointerException at OrderService.total"; sleep 2; done',
            ]
