apiVersion: v1
kind: Namespace
metadata:
  name: missing-configmap-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifier-config
  namespace: missing-configmap-key
data:
  SMTP_PORT: '587'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: missing-configmap-key
  labels: { app: notifier }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notifier }
  template:
    metadata:
      labels: { app: notifier }
    spec:
      containers:
        - name: notifier
          image: busybox:1.37
          command: ['sh', '-c', 'sleep 3600']
          env:
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef: { name: notifier-config, key: SMTP_HOST }
