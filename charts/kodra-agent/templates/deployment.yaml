{{- if and .Values.fileSecrets (not .Values.existingSecret) }}
{{- fail "fileSecrets are mounted from existingSecret: set existingSecret too" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kodra-agent.fullname" . }}
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
spec:
  # One agent per config: two would answer Slack twice and investigate every alert twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kodra-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kodra-agent.selectorLabels" . | nindent 8 }}
      annotations:
        # Restarts the agent when the config changes.
        checksum/config: {{ .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kodra-agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run"]
          env:
            - name: KODRA_AGENT_CONFIG
              value: /etc/kodra-agent/kodra-agent.yaml
            - name: KODRA_AGENT_HEALTH_PORT
              value: "8080"
            {{- if and .Values.console.enabled .Values.console.editSettings .Values.serviceAccount.automountToken }}
            # The agent's own objects, which self-rbac.yaml lets it patch (console settings).
            - name: KODRA_AGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KODRA_AGENT_CONFIGMAP
              value: {{ include "kodra-agent.fullname" . }}-settings
            - name: KODRA_AGENT_SETTINGS_DIR
              value: /etc/kodra-agent-settings
            - name: KODRA_AGENT_DEPLOYMENT
              value: {{ include "kodra-agent.fullname" . }}
            {{- with .Values.existingSecret }}
            - name: KODRA_AGENT_SECRET
              value: {{ . }}
            {{- end }}
            {{- end }}
          {{- with .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            {{- if .Values.console.enabled }}
            - name: console
              containerPort: {{ .Values.console.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kodra-agent
              readOnly: true
            - name: audit
              mountPath: /var/lib/kodra-agent
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.console.enabled .Values.console.editSettings .Values.serviceAccount.automountToken }}
            - name: settings
              mountPath: /etc/kodra-agent-settings
              readOnly: true
            {{- end }}
            {{- range .Values.fileSecrets }}
            - name: file-secrets
              mountPath: {{ .mountPath }}
              subPath: {{ .key }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kodra-agent.fullname" . }}
        - name: audit
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-audit" (include "kodra-agent.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        # The root filesystem is read-only; MCP servers get private folders under /tmp.
        - name: tmp
          emptyDir: {}
        {{- if and .Values.console.enabled .Values.console.editSettings .Values.serviceAccount.automountToken }}
        # What was saved in the console; the agent uses it only if it was made from this config.
        - name: settings
          configMap:
            name: {{ include "kodra-agent.fullname" . }}-settings
            optional: true
        {{- end }}
        {{- if .Values.fileSecrets }}
        - name: file-secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0400
            items:
              {{- range .Values.fileSecrets }}
              - key: {{ .key }}
                path: {{ .key }}
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
