{{- if and .Values.console.enabled .Values.console.editSettings .Values.serviceAccount.automountToken }}
# Settings from the console: the agent may read and patch its own ConfigMap and Secret, and
# restart its own Deployment. resourceNames limits each rule to exactly those objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kodra-agent.fullname" . }}-self
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "kodra-agent.fullname" . | quote }}]
    verbs: ["get", "patch"]
  {{- with .Values.existingSecret }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get", "patch"]
  {{- end }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "kodra-agent.fullname" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kodra-agent.fullname" . }}-self
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kodra-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "kodra-agent.fullname" . }}-self
  apiGroup: rbac.authorization.k8s.io
{{- end }}
