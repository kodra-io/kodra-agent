{{- if and .Values.console.enabled .Values.console.editSettings .Values.serviceAccount.automountToken }}
# Settings from the console. This ConfigMap is the agent's: Helm creates it empty and never
# sets its data, so the console's changes never conflict with a helm upgrade. The Role lets the
# agent read and patch only it, its Secret, and its Deployment (resourceNames), nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kodra-agent.fullname" . }}-settings
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kodra-agent.fullname" . }}-self
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-settings" (include "kodra-agent.fullname" .) | quote }}]
    verbs: ["get", "patch"]
  {{- with .Values.existingSecret }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get", "patch"]
  {{- end }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "kodra-agent.fullname" . | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kodra-agent.fullname" . }}-self
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kodra-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "kodra-agent.fullname" . }}-self
  apiGroup: rbac.authorization.k8s.io
{{- end }}
