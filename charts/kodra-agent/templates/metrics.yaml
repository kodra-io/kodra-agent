{{- if .Values.metrics.enabled }}
# The agent's own Prometheus metrics: counts and durations, never content. ClusterIP only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kodra-agent.fullname" . }}-metrics
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "kodra-agent.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
# For the Prometheus Operator (kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kodra-agent.fullname" . }}
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kodra-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- if .Values.metrics.prometheusRule.enabled }}
---
# Alerts on the agent itself. The same rules are in charts/kodra-agent/files/alerts.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kodra-agent.fullname" . }}
  labels:
    {{- include "kodra-agent.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/alerts.yaml" | nindent 2 }}
{{- end }}
{{- end }}
