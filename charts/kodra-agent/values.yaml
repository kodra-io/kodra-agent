# Kodra AI Agent. Install with the values.yaml from your bundle:
#   helm install my-agent oci://ghcr.io/kodra-io/charts/kodra-agent --version 0.3.9 \
#     --namespace kodra-agent -f values.yaml --set-file config=kodra-agent.yaml

image:
  # A private registry or mirror replaces the host: <registry>/kodra-io/kodra-agent.
  registry: ''
  repository: ghcr.io/kodra-io/kodra-agent
  # Defaults to the chart's appVersion.
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The contents of kodra-agent.yaml. Required: pass it with --set-file config=kodra-agent.yaml.
config: ''

# The Secret that `kodra-agent init --target kubernetes` creates. Its keys become environment
# variables. Secret values never go in this file.
existingSecret: ''

# Secrets referenced as files in kodra-agent.yaml, mounted read-only from existingSecret.
#   - key: kubeconfig
#     mountPath: /secrets/kubeconfig
fileSecrets: []

serviceAccount:
  create: true
  # Defaults to the release name.
  name: ''
  annotations: {}
  # The Kubernetes connector uses this token when the agent runs in the cluster.
  automountToken: true

# Namespace-scoped access for the Kubernetes connector. The bundle ships the same rules in
# rbac.yaml for you to review and apply; turn this on to let the chart create them instead.
rbac:
  create: false
  # Namespaces the agent may read (and change, with write: true).
  namespaces: []
  # Allows patching and scaling deployments. Every change still needs an approval in Slack.
  write: false

# The web console (spec.console in kodra-agent.yaml; keep the ports the same).
# A ClusterIP service only: reach it with kubectl port-forward. No Ingress is created.
console:
  enabled: true
  port: 8081
  # Lets console approvers change settings, secrets, and sign-in tokens from the console: the
  # agent may then read and patch only its own ConfigMap and Secret, and restart its own
  # Deployment. Needs serviceAccount.automountToken. Set false to keep settings read-only.
  editSettings: true

# The agent's own Prometheus metrics (spec.metrics in kodra-agent.yaml; keep the ports the same):
# counts and durations, never content. A ClusterIP service named <release>-kodra-agent-metrics.
metrics:
  enabled: true
  port: 9464
  # A ServiceMonitor for the Prometheus Operator.
  serviceMonitor:
    enabled: false
    interval: 30s
    # Labels your Prometheus selects ServiceMonitors by, like release: kube-prometheus-stack.
    labels: {}
  # A PrometheusRule with alerts on the agent itself (files/alerts.yaml): a connector down,
  # repeated errors, an approval waiting over 15 minutes, and the monthly budget almost spent.
  prometheusRule:
    enabled: false
    labels: {}

# The audit log (spec.audit.path in kodra-agent.yaml, /var/lib/kodra-agent by default).
persistence:
  enabled: false
  existingClaim: ''
  storageClass: ''
  size: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Extra CA certificates (a TLS-inspecting proxy, an internal CA), from a ConfigMap or a Secret,
# mounted at /etc/kodra-agent-ca. Point spec.network.caBundleFile at /etc/kodra-agent-ca/<key>.
caBundle:
  configMap: ''
  secret: ''
  key: ca.pem

# OpenShift assigns each namespace its own user ids: leave runAsUser, runAsGroup, and fsGroup
# unset so the restricted SCC can choose them. The image runs under any user in group 0.
openshift: false

# Outbound traffic for the agent: DNS, the API server, in-cluster services from connector URLs,
# then the proxy alone (spec.network.proxy) or HTTPS to public addresses.
networkPolicy:
  # On for the team and strict profiles when left empty; true or false to choose.
  enabled: null
  # The API server's address and port. Found with helm lookup when empty; set it for helm
  # template and GitOps.
  apiServer:
    cidr: ''
    port: 443
  # Required when spec.network.proxy is set: the proxy's address, like 10.0.0.12/32.
  proxy:
    cidr: ''
    port: 3128
  # Also create a CiliumNetworkPolicy that allows only the connectors' hostnames (toFQDNs).
  cilium: false
  # More egress rules, appended as written.
  extraEgress: []

nodeSelector: {}
tolerations: []
affinity: {}
