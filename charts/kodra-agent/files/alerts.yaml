# Alerts on Kodra AI Agent itself, from its /metrics. A Prometheus rules file: load it with
# rule_files, or let the chart create a PrometheusRule (metrics.prometheusRule.enabled).
groups:
  - name: kodra-agent
    rules:
      - alert: KodraAgentConnectorDown
        expr: kodra_agent_connector_up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Kodra AI Agent cannot use the {{ $labels.connector }} connector'
          description: 'The {{ $labels.connector }} connector has not started for 10 minutes. Run kodra-agent doctor for the reason.'
      - alert: KodraAgentErrors
        expr: increase(kodra_agent_errors_total[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: 'Kodra AI Agent is failing ({{ $labels.source }})'
          description: 'More than 3 errors in 15 minutes. The audit log has the details.'
      - alert: KodraAgentApprovalStuck
        expr: kodra_agent_approval_oldest_seconds > 900
        labels:
          severity: info
        annotations:
          summary: 'A Kodra AI Agent change has waited over 15 minutes for approval'
          description: 'Someone asked for a change and no approver has answered yet.'
      - alert: KodraAgentBudgetLow
        expr: kodra_agent_budget_remaining_ratio < 0.1
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% of Kodra AI Agent's monthly model budget is left"
          description: 'When the budget is used up, the agent stops taking new questions. Alerts are still investigated. An approver can raise it in Settings.'
