name: Release

# A tag like v0.1.0 publishes the multi-arch agent image and the Helm chart to GHCR, signs
# both with cosign (keyless, GitHub OIDC), and creates a GitHub release with the chart, an
# SPDX SBOM, and checksums. Pull requests that touch packaging build everything without
# publishing.
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - docker/**
      - charts/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image and chart on GHCR
      id-token: write # cosign keyless signing
    env:
      IMAGE: ghcr.io/kodra-io/kodra-agent
      CHART_REPO: oci://ghcr.io/kodra-io/charts
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version, and check the tag matches it
        id: version
        run: |
          version=$(node -p "require('./apps/agent/package.json').version")
          chart=$(grep '^version:' charts/kodra-agent/Chart.yaml | awk '{print $2}')
          if [ "$version" != "$chart" ]; then
            echo "apps/agent is $version but the chart is $chart"; exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Install Helm (checksum-verified)
        run: |
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sSfL -o "$archive" "https://get.helm.sh/${archive}"
          echo "${HELM_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm

      - name: Package the chart
        run: |
          mkdir -p dist
          helm lint charts/kodra-agent --set config=placeholder
          helm package charts/kodra-agent --destination dist

      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Push and sign the chart
        if: env.PUBLISH == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/kodra-agent-${VERSION}.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | head -1)
          cosign sign --yes "ghcr.io/kodra-io/charts/kodra-agent@${digest}"

      - name: SBOM (SPDX) of the published image
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/kodra-agent-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create the GitHub release with checksums
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat > notes.md <<EOF
          Image: \`${IMAGE}:${VERSION}\` (\`${DIGEST}\`), linux/amd64 and linux/arm64.
          Chart: \`helm install <name> ${CHART_REPO}/kodra-agent --version ${VERSION}\`.

          Verify the image signature:

          \`\`\`sh
          cosign verify ${IMAGE}:${VERSION} \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file notes.md --generate-notes \
            -- *.tgz *.spdx.json SHA256SUMS
